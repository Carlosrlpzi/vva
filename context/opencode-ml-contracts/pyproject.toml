[project]
name = "mlcode-contracts"
version = "1.1.0"
description = "Validated Python ML contracts and OpenCode tools for DeepSeek Flash; no Jev"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7", "pandas>=2.2", "pyarrow>=15", "numpy>=1.26", "scipy>=1.12",
  "scikit-learn>=1.4", "joblib>=1.3", "openai>=1.40",
  "radon>=6.0", "ruff>=0.6", "mypy>=1.11", "pytest>=8",
]

[project.scripts]
mlcode = "mlclaw.opencode:main"

[project.optional-dependencies]
onnx = ["skl2onnx>=1.17", "onnxruntime>=1.18"]
dev = ["pandas-stubs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlclaw"]

[tool.ruff]
line-length = 120
target-version = "py311"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "ANN", "RUF"]
ignore = ["E501"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
mypy_path = "src"

[tool.pytest.ini_options]
pythonpath = ["src"]
